# Dependabot configuration.
#
# The repository declares its dependencies in four places: the module file of
# Bazel, the root npm manifest, the npm manifest of the TypeScript SDK, and the
# Python manifest of the Python SDK. Dependabot opens a pull request for every
# update, and the pull request lane decides whether the update is safe.
#
# The security updates of Dependabot are enabled in the settings of the
# repository, so a vulnerability of a dependency is reported even before the
# next scheduled run (`SEC-007`).

version: 2

updates:
  - package-ecosystem: bazel
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/packages/typescript"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/packages/python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
