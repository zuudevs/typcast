# Main integration.
#
# The lane runs on every push to `main`. It builds every target and runs the
# test suite on Windows and Linux, it runs the documentation gate, and it
# proves that the repository builds from a clean checkout without a cache.
#
# It has read-only permissions and never publishes. The release lane publishes.

name: Main integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: "true"
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - .bazelversion
          cache-save: true
      - name: Build every target
        run: bazel build //...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: "true"
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - .bazelversion
          cache-save: true
      - name: Run the test lane
        run: bazel test //...

  clean-build:
    name: Clean build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: false
          disk-cache: "false"
          repository-cache: false
          external-cache: ""
      - name: Build from a clean checkout without a cache
        run: bazel build //...

  docs:
    name: Documentation gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: "true"
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - .bazelversion
          cache-save: true
      - name: Run the documentation checks
        run: bazel test //scripts:docs_checks
