[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typcast-publish"
version = "0.1.0"
description = "Release-time publishing tools for Typcast."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
typcast-publish = "typcast_publish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
