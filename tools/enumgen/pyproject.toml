[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typcast-enumgen"
version = "0.1.0"
description = "Build-time enum catalog expansion for Typcast."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
typcast-enumgen = "typcast_enumgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
