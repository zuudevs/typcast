[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typcast-codegen"
version = "0.1.0"
description = "Build-time code generation tools for Typcast."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
typcast-codegen = "typcast_codegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
